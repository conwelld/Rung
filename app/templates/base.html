<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rung is a Socratic coding interview coach that measures how much help a student needs, then turns that evidence into focused practice.">
  <meta name="theme-color" content="#176b54">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rung · Socratic coding interview practice">
  <meta property="og:description" content="Practice the interview, not the answer. Socratic prompts, measured hint depth, and focused next reps.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rung · Socratic coding interview practice">
  <meta name="twitter:description" content="Practice the interview, not the answer. Socratic prompts, measured hint depth, and focused next reps.">
  {% if public_origin %}
  <meta property="og:url" content="{{ public_origin }}{{ request.path }}">
  <meta property="og:image" content="{{ public_origin }}{{ url_for('static', filename='og.png') }}">
  <meta name="twitter:image" content="{{ public_origin }}{{ url_for('static', filename='og.png') }}">
  {% endif %}
  <title>{% block title %}Rung · Socratic coding interview practice{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='rung.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Primary navigation">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Rung home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Rung</span>
      </a>
      <div class="nav-links">
        {% block nav %}
          <a href="{{ url_for('index') }}">Practice</a>
          <a href="{{ url_for('profile') }}">My progress</a>
          {% if instructor_enabled %}
            <a href="{{ url_for('instructor') }}">Instructor</a>
          {% endif %}
        {% endblock %}
      </div>
    </nav>
  </header>
  <main class="container page">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
